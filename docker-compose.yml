services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - "5433:5432"
    volumes:
      - db:/var/lib/postgresql/data
    env_file:
      - ./docker-compose.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  db:
    driver: local
