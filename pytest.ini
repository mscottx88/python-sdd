[pytest]
# Python path - add project root for src. imports
pythonpath = .

# Load environment variables from .env file
env_files =
    .env

# Test paths
testpaths = tests

# Python file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src/csv_postgres_pipeline
    --cov-report=term-missing
    --cov-report=html

# Test markers
markers =
    integration: marks tests as integration tests (require database)
    contract: marks tests as contract tests (test external API contracts)
    unit: marks tests as unit tests (fast, isolated)
